server:
  port: 8080

spring:
  application:
    name: taskflow

  datasource:
    url: ${DB_URL:jdbc:h2:mem:taskflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  seed:
    enabled: ${SEED_SAMPLE_DATA:true}
  jwt:
    secret: ${JWT_SECRET:taskflow-local-development-secret-key-change-before-deploying-123456}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
